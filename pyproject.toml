[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "loto-pke-public"
version = "0.2.0"
description = "Reproducible public-data pipeline for LOTO procedural knowledge extraction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LOTO PKE research team"}]
dependencies = []

[project.optional-dependencies]
parsing = ["Pillow>=10", "PyMuPDF>=1.24", "docling>=2"]
ocr = ["Pillow>=10", "PyMuPDF>=1.24"]
evaluation = ["nltk>=3.9", "networkx>=3.3", "sentence-transformers>=3"]
vision = ["Pillow>=10", "torch>=2.5", "transformers>=4.57", "accelerate>=1"]
all = [
    "Pillow>=10", "PyMuPDF>=1.24", "docling>=2", "nltk>=3.9",
    "networkx>=3.3", "sentence-transformers>=3", "torch>=2.5",
    "transformers>=4.57", "accelerate>=1",
]

[project.scripts]
loto-pke = "loto_pke.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
